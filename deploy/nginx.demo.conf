# Host-installed Nginx template. Replace demo.example.com and certificate paths.
# The application listens only on 127.0.0.1:3000 via compose.demo.yml.
server {
    listen 80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name demo.example.com;

    ssl_certificate /etc/nginx/ssl/demo.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/demo.example.com.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
