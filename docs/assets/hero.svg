<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">探山 Tanshan · 多问一句，答案更近一步</title>
  <desc id="desc">三个独立入口：Agent 问答澄清处境并推荐知乎帖子；阅读助手用阅读地图和摘要导图整理线索；观点圆桌让不同立场展开讨论，用户可随时加入。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F6FF"/><stop offset=".53" stop-color="#F9FBFF"/><stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="72" y1="64" x2="140" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1683FF"/><stop offset="1" stop-color="#056DE8"/>
    </linearGradient>
    <linearGradient id="landscape" x1="1040" y1="205" x2="1535" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6E8FF" stop-opacity="0"/><stop offset=".5" stop-color="#D6E8FF"/><stop offset="1" stop-color="#A7CEFF"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" rx="32" fill="url(#background)"/>
  <g stroke="#DCEBFF" stroke-width="1">
    <circle cx="1396" cy="208" r="116"/><circle cx="1396" cy="208" r="166"/><circle cx="1396" cy="208" r="216"/>
  </g>
  <path d="M1074 327 1196 178l82 91 83-131 174 189H1074Z" fill="url(#landscape)"/>
  <path d="m1196 178 82 91 83-131 174 189" stroke="#9FC9FF" stroke-width="2" stroke-linejoin="round"/>
  <path d="m1074 327 122-149" stroke="#C6DEFF" stroke-width="2"/>
  <rect x="72" y="64" width="68" height="68" rx="20" fill="url(#brand)"/>
  <path d="m85 113 14-32 10 19 10-13 10 26H85Z" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="160" y="108" fill="#152844" font-size="44" font-weight="700">探山</text>
    <text x="274" y="104" fill="#57718F" font-size="21" font-weight="500" letter-spacing="3">TANSHAN</text>
    <text x="72" y="230" fill="#142A48" font-size="54" font-weight="700" letter-spacing="-1">多问一句，答案更近一步。</text>
    <text x="75" y="283" fill="#62758E" font-size="24">把别人的经验，放回自己的处境。</text>

    <rect x="72" y="350" width="448" height="246" rx="24" fill="white" stroke="#D8E6F7"/>
    <rect x="576" y="350" width="448" height="246" rx="24" fill="white" stroke="#D8E6F7"/>
    <rect x="1080" y="350" width="448" height="246" rx="24" fill="white" stroke="#D8E6F7"/>
    <rect x="104" y="382" width="48" height="48" rx="14" fill="#EEF5FF"/>
    <rect x="608" y="382" width="48" height="48" rx="14" fill="#EAF8F5"/>
    <rect x="1112" y="382" width="48" height="48" rx="14" fill="#FFF5E7"/>
    <g stroke="#056DE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M117 396h22v15h-13l-7 6v-6h-2v-15Z"/>
      <path d="M122 401h12m-12 5h8"/>
    </g>
    <g stroke="#279083" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M624 407h10m-6 0v-10m0 10v11m0-21h9m-9 21h9"/>
      <circle cx="621" cy="407" r="3" fill="white"/><circle cx="640" cy="397" r="3" fill="white"/><circle cx="640" cy="418" r="3" fill="white"/>
    </g>
    <g stroke="#B4813E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1136" cy="397" r="4"/><circle cx="1126" cy="414" r="4"/><circle cx="1146" cy="414" r="4"/>
      <path d="m1133 402-4 7m10-7 4 7m-12 5h10"/>
    </g>
    <text x="484" y="414" fill="#A1B3CA" font-size="15" font-weight="600" text-anchor="end" letter-spacing="2">01</text>
    <text x="988" y="414" fill="#A1B3CA" font-size="15" font-weight="600" text-anchor="end" letter-spacing="2">02</text>
    <text x="1492" y="414" fill="#A1B3CA" font-size="15" font-weight="600" text-anchor="end" letter-spacing="2">03</text>
    <text x="104" y="479" fill="#18314F" font-size="30" font-weight="650">Agent 问答</text>
    <text x="608" y="479" fill="#18314F" font-size="30" font-weight="650">阅读助手</text>
    <text x="1112" y="479" fill="#18314F" font-size="30" font-weight="650">观点圆桌</text>
    <text x="104" y="520" fill="#637790" font-size="21">问清处境，找到相关经验</text>
    <text x="608" y="520" fill="#637790" font-size="21">沿着地图，整理阅读线索</text>
    <text x="1112" y="520" fill="#637790" font-size="21">看见不同立场，随时加入</text>
    <path d="M104 550h32" stroke="#056DE8" stroke-width="3" stroke-linecap="round"/>
    <path d="M608 550h32" stroke="#279083" stroke-width="3" stroke-linecap="round"/>
    <path d="M1112 550h32" stroke="#B4813E" stroke-width="3" stroke-linecap="round"/>
    <text x="800" y="658" fill="#70849D" font-size="19" text-anchor="middle" letter-spacing="1">三个独立入口，按需衔接</text>
  </g>
</svg>
